# Push a tag like v0.1.0 to build installers on every OS, attach them to a GitHub Release, and
# publish the npm package (when the NPM_TOKEN secret is set). Run it by hand to just build.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
      - run: node scripts/build.mjs
      - name: Smoke test
        shell: bash
        run: |
          exe=dist/salvia; [ -f dist/salvia.exe ] && exe=dist/salvia.exe
          SALVIA_HOME="$RUNNER_TEMP/salvia-home" "$exe" @help | head -5
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # setup-node puts a placeholder in NODE_AUTH_TOKEN when it's empty, so ask the secret itself.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/build.mjs --npm
      - run: npm pack --pack-destination ..
        working-directory: dist/npm
      - uses: actions/upload-artifact@v5
        with:
          name: npm
          path: dist/*.tgz
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_NPM_TOKEN == 'true'
        working-directory: dist/npm
        run: npm publish --access public

  release:
    needs: [build, npm]
    # Release what was built even if one platform failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
